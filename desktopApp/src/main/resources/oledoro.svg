<?xml version="1.0" encoding="UTF-8"?>
<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background (no fill) -->
  
  <!-- Mechanical Timer Crown and Stem -->
  <!-- Top Crown Button outline (Gruvbox Aqua #8EC07C) -->
  <rect x="48.5" y="18" width="11" height="3.5" fill="none" stroke="#8EC07C" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Crown Stem outline (Gruvbox Aqua #8EC07C) -->
  <rect x="52.5" y="21.5" width="3" height="3.5" fill="none" stroke="#8EC07C" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Left Angled Stopwatch Shoulder (Gruvbox Aqua #8EC07C) -->
  <line x1="35" y1="26" x2="31.5" y2="22.5" stroke="#8EC07C" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right Angled Stopwatch Shoulder (Gruvbox Orange #FE8019) -->
  <line x1="73" y1="26" x2="76.5" y2="22.5" stroke="#FE8019" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Segmented Timer Dial / Progress Ring -->
  <!-- Primary Focus Arc (270° clockwise from 12 o'clock to 9 o'clock) (Gruvbox Orange #FE8019) -->
  <path d="M54,28 A26,26 0 1,1 28,54" fill="none" stroke="#FE8019" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Break Segment Arc (~60° from 9:30 to 11:30) (Gruvbox Aqua #8EC07C) -->
  <path d="M29,47 A26,26 0 0,1 47,29" fill="none" stroke="#8EC07C" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Dial Cardinal Index Dots (Gruvbox Yellow #FABD2F) -->
  <!-- 12 o'clock -->
  <circle cx="54" cy="34" r="1.5" fill="#FABD2F" stroke="none"/>
  <!-- 3 o'clock -->
  <circle cx="73" cy="53" r="1.5" fill="#FABD2F" stroke="none"/>
  <!-- 6 o'clock -->
  <circle cx="54" cy="72" r="1.5" fill="#FABD2F" stroke="none"/>
  <!-- 9 o'clock -->
  <circle cx="35" cy="53" r="1.5" fill="#FABD2F" stroke="none"/>
  
  <!-- Nerd Monospaced Terminal Glyph: Chevron '>' (Gruvbox Yellow #FABD2F) -->
  <path d="M43,47 L50,53 L43,59" fill="none" stroke="#FABD2F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Nerd Monospaced Terminal Cursor '_' (Gruvbox Orange #FE8019) -->
  <line x1="54" y1="59" x2="65" y2="59" stroke="#FE8019" stroke-width="2.5" stroke-linecap="round"/>
</svg>